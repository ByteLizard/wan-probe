{{- if .Values.credentials.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "wan-probe.fullname" . }}-credentials
  labels:
    {{- include "wan-probe.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.credentials.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "wan-probe.credentialsSecretName" . }}
  data:
    {{- toYaml .Values.credentials.externalSecret.data | nindent 4 }}
{{- end }}
