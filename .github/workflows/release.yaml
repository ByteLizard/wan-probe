name: release

# Push to main → ghcr.io/bytelizard/wan-probe:main + :sha-<short>.
# Tag v* → image semver tags AND the Helm chart at
# oci://ghcr.io/bytelizard/charts/wan-probe:<version>, same version as the
# image. kube-apps pins the chart version (OCIRepository) and the image tag it
# carries; Renovate PRs the bumps. Release = `git tag v0.x.y && git push --tags`.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bytelizard/wan-probe
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - run: helm lint charts/wan-probe
      - run: helm package charts/wan-probe --version "${TAG#v}" --app-version "${TAG}" --destination dist
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm push "dist/wan-probe-${TAG#v}.tgz" oci://ghcr.io/bytelizard/charts
